<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hackathon Team Formation Tool</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1>Hackathon Team Formation Tool</h1>
   <!-- ===== Hackathon Selection Section ===== -->
<section id="hackathon-section">
  <h2>Hackathon</h2>

  <label for="hackathon-select">Select an existing hackathon</label>
  <select id="hackathon-select">
    <option value="">-- select a hackathon --</option>
  </select>

  <label for="new-hackathon-name">Or create a new one</label>
  <input type="text" id="new-hackathon-name" placeholder="e.g. Winter Hackathon 2026" />
  <button id="create-hackathon-btn" type="button">Create Hackathon</button>

  <p id="active-hackathon-label"></p>
</section>
  <!-- ===== Participant Form Section ===== -->
  <section id="participant-form-section">
    <h2>Add Participant</h2>
    <form id="participant-form">
      <label for="participant-name">Name</label>
      <input type="text" id="participant-name" required />

      <fieldset>
        <legend>Select your skills (choose 2 to 4)</legend>

        <label><input type="checkbox" name="skill" value="Frontend" /> Frontend</label>
        <label><input type="checkbox" name="skill" value="Backend" /> Backend</label>
        <label><input type="checkbox" name="skill" value="Design" /> Design</label>
        <label><input type="checkbox" name="skill" value="Data/ML" /> Data/ML</label>
        <label><input type="checkbox" name="skill" value="DevOps/Cloud" /> DevOps/Cloud</label>
      </fieldset>

      <label for="primary-skill">Primary skill</label>
      <select id="primary-skill">
        <option value="">-- select your strongest skill --</option>
        <option value="Frontend">Frontend</option>
        <option value="Backend">Backend</option>
        <option value="Design">Design</option>
        <option value="Data/ML">Data/ML</option>
        <option value="DevOps/Cloud">DevOps/Cloud</option>
      </select>

      <p id="form-error" class="error-text"></p>

      <button type="submit">Add Participant</button>
    </form>
  </section>

  <!-- ===== Team Generation Section ===== -->
  <section id="team-generation-section">
    <h2>Generate Teams</h2>
    <label for="team-count">Number of teams</label>
    <input type="number" id="team-count" min="2" />
    <button id="generate-teams-btn">Generate Teams</button>
    <button id="clear-participants-btn" type="button">Clear All Participants</button>
  </section>

  <!-- ===== Results Section ===== -->
  <section id="results-section">
    <h2>Teams</h2>
    <div id="team-cards-container"></div>
  </section>

  <!-- Scripts load in dependency order -->
  <script src="js/storage.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/balancer.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
