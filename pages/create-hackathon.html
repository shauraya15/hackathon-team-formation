<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New hackathon | Formfactor</title><link rel="stylesheet" href="../styles/auth.css"></head><body data-account-type="organizer"><main class="auth-shell"><section class="auth-panel"><a class="wordmark" href="organizer-dashboard.html"><span class="mark"></span>form/factor</a><p class="auth-kicker">Create a new hackathon</p><h1 class="auth-title">Give the room a <em>starting line.</em></h1><p class="auth-copy">Set the event details now. You can use the formation workspace to add participants and reveal teams next.</p><form class="auth-form" id="create-hackathon-form"><div class="form-field"><label for="hackathon-name">Hackathon name</label><input id="hackathon-name" placeholder="Winter Build 2026" required></div><div class="form-field"><label for="description">Description</label><textarea id="description" rows="2" placeholder="What will this room make?"></textarea></div><div class="form-row"><div class="form-field"><label for="start-date">Start date</label><input id="start-date" type="date"></div><div class="form-field"><label for="end-date">End date</label><input id="end-date" type="date"></div></div><div class="form-row"><div class="form-field"><label for="mode">Mode</label><select id="mode"><option>Online</option><option>Offline</option><option>Hybrid</option></select></div><div class="form-field"><label for="venue">Venue</label><input id="venue" placeholder="Optional"></div></div><div class="form-row"><div class="form-field"><label for="deadline">Registration deadline</label><input id="deadline" type="date"></div><div class="form-field"><label for="max-participants">Maximum participants</label><input id="max-participants" type="number" min="1" placeholder="80"></div></div><button class="auth-submit" type="submit">Create hackathon</button></form></section><aside class="auth-visual"><div class="visual-content"><span class="visual-label">FORMFACTOR / NEW ROOM</span><h2 class="visual-title">Every strong team starts with a <em>clear brief.</em></h2></div></aside></main><script src="../js/storage.js"></script><script src="../js/dashboard.js"></script></body></html>
