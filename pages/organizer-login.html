<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Organizer access | Formfactor</title>
  <link rel="stylesheet" href="../styles/auth.css">
</head>
<body data-account-type="organizer">
  <main class="auth-shell">
    <section class="auth-panel">
      <a class="wordmark" href="index.html"><span class="mark"></span>form/factor</a>
      <p class="auth-kicker">Organizer access</p>
      <h1 class="auth-title">Welcome back to <em>better teams.</em></h1>
      <p class="auth-copy">Sign in to pick up where your next event begins.</p>
      <form class="auth-form" id="login-form">
        <div class="form-field"><label for="login">Username or email</label><input id="login" type="text" placeholder="you@example.com" required></div>
        <div class="form-field"><label for="password">Password</label><input id="password" type="password" placeholder="Your password" required></div>
        <p class="auth-error" id="auth-error"></p>
        <button class="auth-submit" type="submit">Continue</button>
      </form>
      <p class="auth-switch"><a href="#forgot" id="forgot-password-link">Forgot password?</a> · New here? <a href="organizer-signup.html">Create an account</a></p>
    </section>
    <aside class="auth-visual"><div class="visual-content"><span class="visual-label">FORMFACTOR / 01</span><h2 class="visual-title">The room is full of potential. <em>Make the mix count.</em></h2><div class="visual-stat"><strong>2–4</strong><span>skills mapped per participant</span></div></div></aside>
  </main>
  <script src="../js/auth.js"></script>
</body>
</html>
