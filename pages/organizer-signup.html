<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create organizer account | Formfactor</title><link rel="stylesheet" href="../styles/auth.css"></head><body data-account-type="organizer"><main class="auth-shell"><section class="auth-panel"><a class="wordmark" href="index.html"><span class="mark"></span>form/factor</a><p class="auth-kicker">New organizer account</p><h1 class="auth-title">Set the room up for <em>great work.</em></h1><form class="auth-form" id="signup-form"><div class="form-row"><div class="form-field"><label for="name">Full name</label><input id="name" required></div><div class="form-field"><label for="org">Organization / college</label><input id="org" required></div></div><div class="form-row"><div class="form-field"><label for="email">Email</label><input id="email" type="email" required></div><div class="form-field"><label for="phone">Phone</label><input id="phone" type="tel" required></div></div><div class="form-field"><label for="username">Username</label><input id="username" required></div><div class="form-row"><div class="form-field"><label for="password">Password</label><input id="password" type="password" required></div><div class="form-field"><label for="confirm-password">Confirm password</label><input id="confirm-password" type="password" required></div></div><p class="auth-error" id="auth-error"></p><button class="auth-submit" type="submit">Create organizer account</button></form><p class="auth-switch">Already registered? <a href="organizer-login.html">Sign in</a></p></section><aside class="auth-visual"><div class="visual-content"><span class="visual-label">FORMFACTOR / ORGANIZE</span><h2 class="visual-title">Start with the people. <em>End with a team.</em></h2></div></aside></main><script src="../js/auth.js"></script></body></html>
